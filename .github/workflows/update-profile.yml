name: update-profile

on:
  schedule:
    - cron: "23 5 * * *" # daily, off the hour to be kind to the API
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py

      - name: Commit regenerated assets
        run: |
          git config user.name "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then
            echo "No changes to generated assets."
          else
            git commit -m "chore(profile): refresh generated assets"
            git push
          fi
